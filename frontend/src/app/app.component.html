<!-- Logo at the Top Left — hidden on admin pages -->
<div class="logo-wrapper" *ngIf="!isAdminPage">
  <a
    routerLink="/"
    class="logo-link"
    routerLinkActive=""
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <img
      src="LOGO GRAHITA.png"
      alt="Grahita Design — Architect Studio"
      class="site-logo"
    />
  </a>
</div>

<!-- Hamburger Navigation Menu Overlay -->
<app-hamburger-menu></app-hamburger-menu>

<!-- Main Area where pages render -->
<main class="app-main-content">
  <router-outlet></router-outlet>
</main>
